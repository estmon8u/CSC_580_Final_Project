# Name: Esteban Montelongo
# Course: CSC 580 AI 2
# Assignment: Final Project — Dream the Road
# AI tools consulted: GitHub Copilot
#
# SHOWCASE EVALUATION — Iter 23 (Behaviour-Optimized)
#
# Phase B evaluation: same iter 23 weights evaluated in denser traffic.
# 6 lanes, 45 vehicles. All other settings match final_run_iter23_behaviour.yaml
# (steering_penalty=0.015, actor_entropy_weight=0.001).

seed: 7
device: cuda
env:
  env_id: highway-v0
  observation_height: 64
  observation_width: 64
  frame_stack: 3
  max_episode_steps: 120
  lanes_count: 6
  vehicles_count: 45
  npc_speed_scale: 0.65
  simulation_frequency: 15
  policy_frequency: 5
  action:
    type: continuous
    longitudinal: true
    lateral: true
    longitudinal_scale: 0.7
    lateral_scale: 0.35
    smoothing_factor: 0.5
  reward:
    collision_reward: -1.0
    right_lane_reward: 0.0
    high_speed_reward: 0.8
    lane_change_reward: 0.0
    overtake_reward: 2.5
    normalize_reward: false
    reward_speed_range: [26.0, 35.0]
    offroad_terminal: true
    offroad_penalty: 0.5
    steering_penalty: 0.015
    steering_change_penalty: 0.02
replay:
  capacity: 500000
  sequence_length: 16
  batch_size: 256
training:
  batch_size: 384
  imagination_horizon: 20
  discount: 0.99
  lambda_: 0.95
  overshooting_horizon: 5
  overshooting_kl_weight: 0.5
  world_model_lr: 0.0003
  actor_lr: 0.00008
  critic_lr: 0.00008
  actor_entropy_weight: 0.001
  kl_weight: 1.0
  free_nats: 3.0
  continue_loss_weight: 1.0
  grad_clip_norm: 100.0
  deterministic_torch: false
  lr_warmup_steps: 50
  use_amp: true
  amp_dtype: bfloat16
  world_model_updates_per_cycle: 8
  behavior_updates_per_cycle: 8
  cycles: 2000
  warm_start_steps: 10000
  policy_steps: 32
  checkpoint_interval: 25
evaluation:
  interval: 25
  episodes: 10
  max_steps: 200
model:
  embedding_dim: 1024
  deterministic_dim: 200
  stochastic_dim: 30
  hidden_dim: 200
