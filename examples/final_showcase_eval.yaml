# Name: Esteban Montelongo
# Course: CSC 580 AI 2
# Assignment: Final Project — Dream the Road
# AI tools consulted: GitHub Copilot
#
# SHOWCASE EVALUATION CONFIG — Phase B: denser traffic, more lanes.
#
# This config is NOT used for training.  After a strong Phase-A checkpoint
# is produced by final_run.yaml, pass this config to record_demo_videos()
# so the same trained policy is demoed in a harder, more visually impressive
# environment:
#   - 6 lanes (wider road, more overtaking opportunities)
#   - 45 vehicles (denser traffic, more interactions visible in GIF)
#   - 60-step episodes (longer to show driving behaviour)
#
# The model architecture block is copied from final_run.yaml so the same
# TinyWorldModel / Actor instances can be rebuilt before weight loading.
# Only the env block is meaningfully different.

seed: 7
device: cuda
env:
  env_id: highway-v0
  observation_height: 64
  observation_width: 64
  frame_stack: 1
  max_episode_steps: 60
  lanes_count: 6
  vehicles_count: 45
  simulation_frequency: 15
  policy_frequency: 5
  action:
    type: continuous
    longitudinal: true
    lateral: true
    longitudinal_scale: 0.9
    lateral_scale: 0.4
    smoothing_factor: 0.35
  reward:
    collision_reward: -1.0
    right_lane_reward: 0.0
    high_speed_reward: 0.5
    lane_change_reward: 0.0
    normalize_reward: true
    reward_speed_range: [20.0, 30.0]
    offroad_terminal: true
    offroad_penalty: 0.5
    steering_penalty: 0.01
    steering_change_penalty: 0.03
replay:
  capacity: 100000
  sequence_length: 16
  batch_size: 256
training:
  batch_size: 256
  imagination_horizon: 20
  discount: 0.99
  lambda_: 0.95
  overshooting_horizon: 5
  overshooting_kl_weight: 0.5
  world_model_lr: 0.0003
  actor_lr: 0.00008
  critic_lr: 0.00008
  kl_weight: 1.0
  free_nats: 3.0
  continue_loss_weight: 1.0
  grad_clip_norm: 100.0
  lr_warmup_steps: 50
  use_amp: true
  amp_dtype: bfloat16
  use_flash_optimizer: true
  world_model_updates_per_cycle: 16
  behavior_updates_per_cycle: 16
  cycles: 2000
  warm_start_steps: 10000
  policy_steps: 64
  checkpoint_interval: 25
evaluation:
  interval: 25
  episodes: 3
  max_steps: 200
model:
  embedding_dim: 1024
  deterministic_dim: 200
  stochastic_dim: 30
  hidden_dim: 200
  rssm_num_layers: 2
  rssm_min_std: 0.1
  actor_hidden_dim: 200
  actor_num_layers: 2
  actor_init_std: 1.0
  actor_mean_scale: 5.0
  actor_min_std: 0.0001
  critic_hidden_dim: 200
  critic_num_layers: 3
  critic_distribution_std: 1.0
  observation_distribution_std: 1.0
  reward_hidden_dim: 200
  reward_num_layers: 2
  reward_distribution_std: 1.0
  use_continue_model: true
  continue_hidden_dim: 200
  continue_num_layers: 2
